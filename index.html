<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ტრანზაქციები</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BPG+Arial&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f0e8;
    --paper-dim: #ebe5d7;
    --ink: #1a1714;
    --ink-soft: #534b40;
    --rule: #c9beac;
    --accent: #a83232;
    --accent-soft: #e8d5d2;
    --gel: #2d5a3d;
    --usd: #6b4423;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    font-family: 'Cormorant Garamond', 'BPG Arial', Georgia, serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 48px 32px 80px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(168,50,50,0.04) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(45,90,61,0.03) 0%, transparent 40%);
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 24px;
    margin-bottom: 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 56px;
    letter-spacing: -0.02em;
    line-height: 0.95;
    font-style: italic;
  }
  h1 .small {
    display: block;
    font-style: normal;
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }
  .stats {
    display: flex;
    gap: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .stat { text-align: right; }
  .stat .label {
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .stat .value {
    font-size: 22px;
    font-weight: 500;
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
  }
  .stat.usd .value { color: var(--usd); }
  .stat.gel .value { color: var(--gel); }

  .filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
    padding: 20px;
    background: var(--paper-dim);
    border: 1px solid var(--rule);
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
  }
  .field input, .field select {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
  }
  .field input::placeholder { color: #a89c87; }

  .meta-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    padding: 0 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
  }
  .clear {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    padding: 4px 0;
    border-bottom: 1px solid transparent;
  }
  .clear:hover { border-bottom-color: var(--accent); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--paper);
  }
  thead th {
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--ink-soft);
    padding: 12px 14px;
    border-bottom: 1.5px solid var(--ink);
    font-weight: 500;
    background: var(--paper-dim);
  }
  tbody tr {
    border-bottom: 1px solid var(--rule);
    transition: background 0.1s;
  }
  tbody tr:hover { background: var(--paper-dim); }
  tbody td {
    padding: 14px;
    vertical-align: top;
    font-size: 15px;
  }
  td.mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  td.qty {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 18px;
    text-align: right;
    white-space: nowrap;
  }
  .pill {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    padding: 3px 8px;
    border: 1px solid;
    margin-left: 8px;
    vertical-align: middle;
  }
  .pill.gel { color: var(--gel); border-color: var(--gel); }
  .pill.usd { color: var(--usd); border-color: var(--usd); }

  .note {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 14px;
    line-height: 1.4;
    max-width: 380px;
  }
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 18px;
  }

  @media (max-width: 900px) {
    body { padding: 24px 16px 48px; font-size: 15px; }
    h1 { font-size: 38px; }
    .filters { grid-template-columns: 1fr 1fr; }
    .stats { gap: 20px; }
    .stat .value { font-size: 18px; }
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tbody tr { padding: 14px 4px; }
    tbody td { padding: 4px 0; border: none; }
    td.mono { font-size: 11px; }
    .note { max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="small">Bank Statement · 2024–2025</span>ტრანზაქციები</h1>
    <div class="stats">
      <div class="stat gel">
        <div class="label">Total GEL</div>
        <div class="value" id="totGel">—</div>
      </div>
      <div class="stat usd">
        <div class="label">Total USD</div>
        <div class="value" id="totUsd">—</div>
      </div>
    </div>
  </header>

  <div class="filters">
    <div class="field">
      <label for="q">Search text · note · IBAN</label>
      <input id="q" type="text" placeholder="ძიება…" autocomplete="off">
    </div>
    <div class="field">
      <label for="fromSel">From</label>
      <select id="fromSel"><option value="">All</option></select>
    </div>
    <div class="field">
      <label for="toSel">To</label>
      <select id="toSel"><option value="">All</option></select>
    </div>
    <div class="field">
      <label for="curSel">Currency</label>
      <select id="curSel">
        <option value="">All</option>
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
      </select>
    </div>
  </div>

  <div class="meta-bar">
    <span id="count">— transactions</span>
    <button class="clear" id="clearBtn">Reset filters</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:130px">Date</th>
        <th>From → To</th>
        <th>Note</th>
        <th style="width:140px;text-align:right">Amount</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">ვერაფერი მოიძებნა</div>
</div>

const q = document.getElementById('q');
const fromSel = document.getElementById('fromSel');
const toSel = document.getElementById('toSel');
const curSel = document.getElementById('curSel');
const rowsEl = document.getElementById('rows');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');
const totGelEl = document.getElementById('totGel');
const totUsdEl = document.getElementById('totUsd');
const clearBtn = document.getElementById('clearBtn');

// Populate selects with unique values
const uniq = (arr) => [...new Set(arr)].sort();
uniq(DATA.map(d => d.from)).forEach(v => {
  const o = document.createElement('option'); o.value = v; o.textContent = v; fromSel.appendChild(o);
});
uniq(DATA.map(d => d.to)).forEach(v => {
  const o = document.createElement('option'); o.value = v; o.textContent = v; toSel.appendChild(o);
});

const fmtNum = (n) => {
  if (Number.isInteger(n)) return n.toLocaleString('en-US');
  return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

// Extract date string from text (last 3 tokens)
const dateFromText = (t) => t.split(' ').slice(-3).join(' ');

function render() {
  const qv = q.value.trim().toLowerCase();
  const fv = fromSel.value;
  const tv = toSel.value;
  const cv = curSel.value;

  const filtered = DATA.filter(d => {
    if (fv && d.from !== fv) return false;
    if (tv && d.to !== tv) return false;
    if (cv && d.currency !== cv) return false;
    if (qv) {
      const hay = (d.text + ' ' + d.note + ' ' + d.from + ' ' + d.to).toLowerCase();
      if (!hay.includes(qv)) return false;
    }
    return true;
  });

  rowsEl.innerHTML = '';
  filtered.forEach(d => {
    const tr = document.createElement('tr');
    const date = dateFromText(d.text);
    tr.innerHTML = `
      <td class="mono">${date}</td>
      <td class="mono">${d.from}<br>↓<br>${d.to}</td>
      <td class="note">${d.note || '—'}</td>
      <td class="qty">${fmtNum(d.quantity)}<span class="pill ${d.currency}">${d.currency}</span></td>
    `;
    rowsEl.appendChild(tr);
  });

  emptyEl.style.display = filtered.length ? 'none' : 'block';
  countEl.textContent = filtered.length + (filtered.length === 1 ? ' transaction' : ' transactions');

  const sumG = filtered.filter(d => d.currency === 'gel').reduce((s, d) => s + d.quantity, 0);
  const sumU = filtered.filter(d => d.currency === 'usd').reduce((s, d) => s + d.quantity, 0);
  totGelEl.textContent = fmtNum(Math.round(sumG * 100) / 100);
  totUsdEl.textContent = fmtNum(Math.round(sumU * 100) / 100);
}

[q, fromSel, toSel, curSel].forEach(el => el.addEventListener('input', render));
clearBtn.addEventListener('click', () => {
  q.value = ''; fromSel.value = ''; toSel.value = ''; curSel.value = '';
  render();
});

render();
</script>
